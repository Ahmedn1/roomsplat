<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ROOM_NAME}} — roomsplat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

  #ui {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 20px; pointer-events: none; z-index: 10;
  }
  #room-name {
    color: #fff; font-size: 1.1rem; font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,.7);
    background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
    padding: 6px 14px; border-radius: 8px;
  }
  #controls {
    color: rgba(255,255,255,.65); font-size: .75rem; line-height: 1.7;
    text-align: right;
    background: rgba(0,0,0,.3); backdrop-filter: blur(6px);
    padding: 8px 12px; border-radius: 8px;
  }
  #loading {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #111; color: #ccc; gap: 16px; z-index: 20;
  }
  #loading h2 { font-size: 1.3rem; font-weight: 400; }
  #progress-bar {
    width: 280px; height: 4px; background: #333; border-radius: 2px; overflow: hidden;
  }
  #progress-fill { height: 100%; width: 0; background: #4ea8de; transition: width .1s; }
  #loading-status { font-size: .8rem; color: #666; }
  #coords {
    position: absolute; bottom: 16px; left: 20px;
    color: rgba(255,255,255,.8); font-size: .72rem; line-height: 1.6;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,.4); backdrop-filter: blur(6px);
    padding: 6px 10px; border-radius: 6px;
    pointer-events: none; white-space: pre; z-index: 10;
  }
  #format-toggle {
    position: absolute; bottom: 16px; right: 20px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,.45); backdrop-filter: blur(6px);
    padding: 6px 12px; border-radius: 6px; z-index: 10;
  }
  #format-toggle span {
    font-size: .72rem; color: rgba(255,255,255,.55);
  }
  #format-toggle button {
    font-size: .72rem; padding: 3px 10px; border-radius: 4px; border: none;
    cursor: pointer; font-weight: 600; transition: background .15s;
  }
  #btn-splat { background: #4ea8de; color: #fff; }
  #btn-ply   { background: #333;    color: #aaa; }
  #btn-splat.active { background: #4ea8de; color: #fff; }
  #btn-ply.active   { background: #5cb85c; color: #fff; }
  #format-quality {
    font-size: .68rem; color: rgba(255,255,255,.45);
  }
</style>
</head>
<body>

<div id="ui">
  <div id="room-name">{{ROOM_NAME}}</div>
  <div id="controls">
    Left-drag — orbit<br>
    Right-drag — pan<br>
    Scroll — zoom<br>
    WASD — fly
  </div>
</div>

<div id="coords"></div>

<div id="format-toggle">
  <span>Quality:</span>
  <button id="btn-splat">.splat</button>
  <button id="btn-ply">.ply</button>
  <span id="format-quality"></span>
</div>

<div id="loading">
  <h2>Loading room…</h2>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="loading-status"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js';

(async () => {
  // ── Format selection ─────────────────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  const usePly = params.get('format') === 'ply';
  const sceneFile = usePly ? 'scene.ply' : 'scene.splat';

  const btnSplat = document.getElementById('btn-splat');
  const btnPly   = document.getElementById('btn-ply');
  const qualEl   = document.getElementById('format-quality');

  btnSplat.classList.toggle('active', !usePly);
  btnPly.classList.toggle('active',   usePly);
  qualEl.textContent = usePly
    ? 'SH2 view-dependent colour'
    : 'SH0 (flat colour) — faster load';

  btnSplat.addEventListener('click', () => {
    if (!usePly) return;
    params.delete('format');
    location.search = params.toString();
  });
  btnPly.addEventListener('click', () => {
    if (usePly) return;
    params.set('format', 'ply');
    location.search = params.toString();
  });

  // ── Loading UI ────────────────────────────────────────────────────────────────
  const progressFill  = document.getElementById('progress-fill');
  const loadingStatus = document.getElementById('loading-status');
  const loading       = document.getElementById('loading');
  loadingStatus.textContent = `Fetching ${sceneFile}…`;

  // ── Camera pose from cameras.json ─────────────────────────────────────────────
  let camPos    = undefined;
  let camLookAt = undefined;
  try {
    const cd = await fetch('cameras.json').then(r => r.ok ? r.json() : null);
    if (cd && cd.cameras && cd.cameras.length > 0) {
      const cam = cd.cameras[cd.initial ?? Math.floor(cd.cameras.length / 2)];
      const p = cam.pos, fwd = cam.forward;
      camPos    = p;
      camLookAt = [p[0] + fwd[0], p[1] + fwd[1], p[2] + fwd[2]];
    }
  } catch (_) {}

  // ── Viewer ────────────────────────────────────────────────────────────────────
  const viewerOpts = {
    cameraUp: [0, -1, 0],
    selfDrivenMode: true,
    useBuiltInControls: true,
    renderMode: GaussianSplats3D.RenderMode.OnChange,
  };
  if (camPos)    viewerOpts.initialCameraPosition = camPos;
  if (camLookAt) viewerOpts.initialCameraLookAt   = camLookAt;

  const viewer = new GaussianSplats3D.Viewer(viewerOpts);

  const sceneOpts = {
    splatAlphaRemovalThreshold: 5,
    showLoadingUI: false,
    onProgress(pct) {
      progressFill.style.width = pct + '%';
      loadingStatus.textContent = pct < 100
        ? `Loading… ${pct.toFixed(0)}%`
        : 'Processing…';
    },
  };
  if (usePly) sceneOpts.sphericalHarmonicsDegree = 2;

  await viewer.addSplatScene(sceneFile, sceneOpts);

  loading.style.display = 'none';
  viewer.start();

  // ── Live camera HUD ───────────────────────────────────────────────────────────
  const coordsEl = document.getElementById('coords');
  const fmt = n => n.toFixed(3).padStart(8);
  (function tick() {
    requestAnimationFrame(tick);
    const p = viewer.camera && viewer.camera.position;
    if (p) coordsEl.textContent = `x:${fmt(p.x)}  y:${fmt(p.y)}  z:${fmt(p.z)}`;
  })();
})();
</script>

</body>
</html>
